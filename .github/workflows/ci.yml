name: ci

on:
  push:
    branches: [main, "build/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  catalogue:
    name: Permission catalogue in sync with doc 28
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 tools/gen_permissions.py --check

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - run: dotnet build SecureIntake.slnx -c Release
      - run: dotnet test SecureIntake.slnx -c Release --no-build

  postgres:
    name: Isolation suite on PostgreSQL (RLS)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: admin
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SECUREINTAKE_TEST_POSTGRES: Host=127.0.0.1;Port=5432;Username=postgres;Password=admin;Database=postgres
      SECUREINTAKE_TEST_APP_PASSWORD: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - name: Create the non-owner runtime role
        run: |
          PGPASSWORD=admin psql -h 127.0.0.1 -U postgres -c \
            "CREATE ROLE secureintake_app LOGIN PASSWORD 'app' NOSUPERUSER NOBYPASSRLS NOCREATEDB;"
      - run: dotnet test tests/SecureIntake.IntegrationTests -c Release

  mlkem:
    name: Hybrid KEM tests (Alpine, OpenSSL 3.5)
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/dotnet/sdk:10.0-alpine
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: All unit tests, including ML-KEM and the hybrid vector, must run (none skipped)
        run: |
          dotnet test tests/SecureIntake.UnitTests -c Release --logger "console;verbosity=normal" | tee test.log
          if grep -qE "^\s+Skipped " test.log; then echo "Tests were skipped on a platform that must support ML-KEM"; exit 1; fi

  aot:
    name: Native AOT publish (${{ matrix.rid }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, rid: linux-x64 }
          - { os: ubuntu-24.04-arm, rid: linux-arm64 }
          - { os: macos-latest, rid: osx-arm64 }
          - { os: windows-latest, rid: win-x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - name: Publish (trim and AOT warnings are errors)
        run: dotnet publish src/SecureIntake.Host -c Release -r ${{ matrix.rid }} -o out
      - name: Smoke test the native binary
        shell: bash
        env:
          SECUREINTAKE__Profile: Development
          SECUREINTAKE__DataDirectory: ${{ runner.temp }}/si
        run: |
          ./out/secureintake version
          ./out/secureintake migrate
          ./out/secureintake organisations create --name "CI Org" --slug ci-org --activate
          ./out/secureintake audit checkpoint
          ./out/secureintake audit verify

  portal-crypto:
    name: TypeScript crypto-protocol (vectors and negative tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - run: npm test
        working-directory: frontend/packages/crypto-protocol
